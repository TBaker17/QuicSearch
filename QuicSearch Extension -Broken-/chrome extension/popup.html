<!DOCTYPE html>
<html>
<head>
  <title>QuicSearch</title>
  <style>
    /* Style for the entire popup */
    body {
      width: 350px; /* Smaller width for the mini tab */
      height: 400px; /* Larger height to accommodate results */
      margin: 0; /* Remove default margins */
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-color: #f5f5f5; /* Light background color */
      font-family: Arial, sans-serif; /* Set a consistent font */
    }

    /* Style for the search container */
    .search-container {
      width: 90%; /* Slightly smaller than the full width */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px; /* Space between elements */
      margin-top: 10px;
    }

    /* Style for the logo */
    .search-logo {
      width: 60px; /* Smaller logo */
      height: auto; /* Maintain aspect ratio */
    }

    /* Style for the input field */
    #searchInput {
      width: 100%; /* Full width of the container */
      padding: 10px; /* Add padding inside the input */
      font-size: 16px; /* Larger font size */
      border: 1px solid #ccc; /* Light border */
      border-radius: 5px; /* Rounded corners */
      box-sizing: border-box; /* Prevent overflow */
    }

    /* Style for the button */
    #searchButton {
      width: 100%; /* Full width of the container */
      padding: 10px; /* Add padding inside the button */
      font-size: 16px; /* Larger font size */
      background-color: #0078d7; /* Primary blue color */
      color: white; /* White text */
      border: none; /* Remove default border */
      border-radius: 5px; /* Rounded corners */
      cursor: pointer; /* Show pointer on hover */
    }

    /* Hover effect for the button */
    #searchButton:hover {
      background-color: #005bb5; /* Darker blue on hover */
    }

    /* Style for the search result container */
    .result-item {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="search-container">
    <!-- Logo Image -->
    <img src="logo.png" alt="Logo" class="search-logo">
    <!-- Search Input Field -->
    <input type="text" id="searchInput" placeholder="What are you looking for...">
    <!-- Search Button -->
    <button id="searchButton">Search</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
